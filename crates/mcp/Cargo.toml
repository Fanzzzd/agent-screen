[package]
name = "agent-screen-mcp"
version = "0.1.18"
edition = "2024"
license = "MIT"
publish = false
description = "Agent Screen's MCP server: tools for Agent Sessions, served over stdio, talking to the app's control socket."

[lib]
path = "src/lib.rs"

[[bin]]
name = "agent-screen-mcp"
path = "src/main.rs"

[dependencies]
agent-screen-model = { path = "../model" }
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
