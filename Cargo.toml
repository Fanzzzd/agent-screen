[workspace]
resolver = "2"
members = ["apps/macos", "crates/model", "crates/mcp", "crates/colorsync", "tests/e2e"]
# Zed's code, patched in below; linted upstream, not here.
exclude = ["vendor"]

# Frames present off the main thread; see vendor/gpui_apple/Cargo.toml.
[patch."https://github.com/zed-industries/zed"]
gpui_apple = { path = "vendor/gpui_apple" }

# The test builds draw and lay out at about the speed users get: GPUI
# unoptimized takes tens of ms a frame, which hides what animations do.
[profile.dev.package."*"]
opt-level = 2
