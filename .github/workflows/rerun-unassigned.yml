# GitHub cancels a job after 15 minutes when no macOS runner takes it.
# Of the 36 failed CI attempts from 10 to 19 November, 32 were that and
# a plain rerun passed; see docs/research/ci-reliability.md. This reruns
# such a run up to twice, and never a run where something really failed
# or a pull request's run a newer push replaced. A rerun's own completion
# fires workflow_run again, so the second rerun happens; see the script.
# workflow_run uses this file from main, so a change here acts after merge.
name: Rerun jobs no runner took

on:
  workflow_run:
    workflows: [CI, Release]
    types: [completed]

permissions:
  actions: write
  checks: read
  contents: read

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: .github/scripts
      - name: Rerun the jobs if no runner took them
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: .github/scripts/rerun-unassigned.sh "$RUN_ID"
