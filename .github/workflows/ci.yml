name: CI

on:
  # The release branch is pushed by prepare-release.yml with a deploy key;
  # its push runs are the checks on the release pull request.
  push:
    branches: [main, release]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run it replaces. Runs on main
# and release always finish: each is a commit's own check.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Action versions are pinned to commits; the comment names the release.
# docs/research/ci-reliability.md has the measurements behind this layout.
jobs:
  # What needs no Mac runs on Linux, where a runner is always free:
  # macOS arm64 runners were not assigned to 8% of macOS jobs in November.
  linux:
    name: Linux checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The changeset reminder compares a push with the commit before.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}

      # rust-toolchain.toml pins the version; rustup installs it on first use.
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check

      # knope's single [package] is named default. Any other key leaves the
      # change out of the release without an error (0.1.18 and 0.1.19 lost
      # seven notes that way), so a wrong key fails here.
      - name: Does every changeset name the default package?
        run: |
          set -euo pipefail
          # A release PR has consumed every changeset: no file is no error.
          shopt -s nullglob
          bad=0
          for f in .changeset/*.md; do
            [[ "$(basename "$f")" == README.md ]] && continue
            keys="$(awk 'NR==1 && $0!="---" {exit} NR>1 && $0=="---" {exit} NR>1' "$f" | cut -d: -f1)"
            if [[ "$keys" != "default" ]]; then
              echo "::error file=$f::The front matter must be 'default: patch|minor|major', not '$keys'."
              bad=1
            fi
          done
          exit "$bad"

      # The Worker lets browsers keep a versioned /media/ file for a year,
      # so a film changed without its new version would never reach them.
      - name: Do the website's media versions match the files?
        run: node apps/website/scripts/version-media.mjs --check

      # A reminder, not a gate: tests and refactors need no changeset.
      - name: Does the app change come with a changeset?
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$BEFORE" 2>/dev/null || exit 0
          changed="$(git diff --name-only "$BEFORE" "$AFTER")"
          app="$(grep -E '^(apps/macos|crates/(mcp|model))/(src|resources)/' <<<"$changed" || true)"
          notes="$(grep -E '^\.changeset/.+\.md$' <<<"$changed" || true)"
          if [[ -n "$app" && -z "$notes" ]]; then
            echo "::warning::The app changed without a changeset. If users will notice, run \`knope document-change\`."
          fi

      # The model crate holds the rules with no OS calls (CLAUDE.md); a
      # Linux build keeps it that way.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy -p agent-screen-model --all-targets --locked -- -D warnings
      - run: cargo test -p agent-screen-model --locked

  # One macOS job per pull request: each extra one is another chance that
  # no runner takes it. The job id stays `rust` so the cache key does too.
  rust:
    name: macOS build and tests
    if: github.event_name != 'pull_request' || github.head_ref != 'release' || github.event.pull_request.head.repo.full_name != github.repository
    # apple-metal needs the macOS 26 SDK.
    runs-on: macos-26
    # A warm run takes 3 minutes, a cold one 18.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: rustup show active-toolchain
      # Only main saves: the repository's 10 GB of cache held pull request
      # caches that pushed main's out. release.yml restores this one too.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The app says it needs macOS 15. It builds only with the macOS 26
      # SDK, so build the release binary here and start it on 15 below, as
      # release.sh builds it. Pushes only: a pull request's merge runs it.
      - name: Build the release binary
        if: github.event_name != 'pull_request'
        run: cargo build --release --locked -p agent-screen -p agent-screen-colorsync
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-screen-binary
          path: target/release/AgentScreen
          if-no-files-found: error
          retention-days: 7

  # A symbol macOS 15 lacks fails at load. Pushes to main and release run
  # it, so it still gates the release pull request.
  starts-on-macos-15:
    needs: rust
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-screen-binary
      - run: |
          chmod +x AgentScreen
          ./AgentScreen --version
