name: CI

on:
  # The release branch is pushed by prepare-release.yml with a deploy key;
  # its push runs are the checks on the release pull request.
  push:
    branches: [main, release]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    if: github.event_name != 'pull_request' || github.head_ref != 'release' || github.event.pull_request.head.repo.full_name != github.repository
    # apple-metal needs the macOS 26 SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml pins the version; rustup installs it on first use.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  changeset-package:
    # knope's single [package] is named default. Any other key leaves the
    # change out of the release without an error (0.1.18 and 0.1.19 lost
    # seven notes that way), so a wrong key fails here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Does every changeset name the default package?
        run: |
          set -euo pipefail
          # A release PR has consumed every changeset: no file is no error.
          shopt -s nullglob
          bad=0
          for f in .changeset/*.md; do
            [[ "$(basename "$f")" == README.md ]] && continue
            keys="$(awk 'NR==1 && $0!="---" {exit} NR>1 && $0=="---" {exit} NR>1' "$f" | cut -d: -f1)"
            if [[ "$keys" != "default" ]]; then
              echo "::error file=$f::The front matter must be 'default: patch|minor|major', not '$keys'."
              bad=1
            fi
          done
          exit "$bad"

  changeset:
    # A reminder, not a gate: tests and refactors need no changeset.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Does the app change come with a changeset?
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$BEFORE" 2>/dev/null || exit 0
          changed="$(git diff --name-only "$BEFORE" "$AFTER")"
          app="$(grep -E '^(apps/macos|crates/(mcp|model))/(src|resources)/' <<<"$changed" || true)"
          notes="$(grep -E '^\.changeset/.+\.md$' <<<"$changed" || true)"
          if [[ -n "$app" && -z "$notes" ]]; then
            echo "::warning::The app changed without a changeset. If users will notice, run \`knope document-change\`."
          fi

  # The app says it needs macOS 15. It builds only with the macOS 26 SDK,
  # so build there and start it on 15: a symbol 15 lacks fails at load.
  build-release:
    if: github.event_name != 'pull_request' || github.head_ref != 'release' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p agent-screen
      - uses: actions/upload-artifact@v4
        with:
          name: agent-screen-binary
          path: target/release/AgentScreen
          if-no-files-found: error

  starts-on-macos-15:
    needs: build-release
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agent-screen-binary
      - run: |
          chmod +x AgentScreen
          ./AgentScreen --version
