# Publishes a release when a "chore(release): Agent Screen x.y.z" pull
# request from prepare-release.yml merges: checks, signs and builds the
# DMG, has knope tag v<version> and publish the GitHub release with the
# CHANGELOG.md section and the DMG, then points the Homebrew tap at it.
#
# Run it from the Actions tab for a dry run: check, sign and build only,
# with the DMG kept as an artifact. With "publish" ticked it publishes the
# current version instead, skipping what's already done: to finish a
# release that failed partway.
#
# Secrets:
# - DEVELOPER_ID_P12_BASE64, DEVELOPER_ID_P12_PASSWORD: the Developer ID
#   Application certificate and its private key.
# - APP_STORE_CONNECT_KEY_P8, APP_STORE_CONNECT_KEY_ID,
#   APP_STORE_CONNECT_ISSUER_ID: an App Store Connect API key of the same
#   team, which notarizes the DMG.
# - TAP_DEPLOY_KEY: private half of a write deploy key of
#   Fanzzzd/homebrew-agent-screen.
# - SPARKLE_ED_PRIVATE_KEY: the EdDSA key Sparkle updates are signed with;
#   its public half is SUPublicEDKey in apps/macos/resources/Info.plist
#   (ADR 0012).
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the current version, skipping what is already done"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: release

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged && github.head_ref == 'release')
    runs-on: macos-26
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Version
        id: version
        run: echo "version=$(awk -F'"' '/^version/ { print $2; exit }' apps/macos/Cargo.toml)" >> "$GITHUB_OUTPUT"

      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Import the Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$P12_PASSWORD" -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          existing=()
          while IFS= read -r line; do existing+=("$(echo "$line" | xargs)"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          security find-identity -v -p codesigning "$keychain" | grep -F "Developer ID Application"

      - name: Build and notarize the DMG and cask
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          export NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          printf '%s\n' "$KEY_P8" > "$NOTARY_KEY"
          trap 'rm -f "$NOTARY_KEY"' EXIT
          apps/macos/scripts/release.sh
          # Installed apps find updates through it.
          test -s target/appcast.xml

      - name: Keep the DMG and cask
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            target/AgentScreen-*.dmg
            target/agent-screen.rb
            target/appcast.xml
          if-no-files-found: error

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2> /dev/null || true

  # knope's release binary runs on Linux runners; the DMG comes over as an
  # artifact.
  publish:
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: target
      - uses: knope-dev/action@v2.1.2
        with:
          version: 0.23.0

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            # Finishing a release: the DMG on GitHub is the one users get,
            # and a rebuild never has the same bytes, so the cask follows it.
            echo "v$VERSION is already released"
            # This build's appcast signs a rebuilt DMG, not the one on
            # GitHub: keep the release's own.
            gh release view "v$VERSION" --json assets --jq '.assets[].name' | grep -qx appcast.xml ||
              echo "::warning::v$VERSION has no appcast.xml; installed apps won't see it"
            gh release download "v$VERSION" --pattern '*.dmg' --dir "$RUNNER_TEMP/check"
            sha="$(sha256sum "$RUNNER_TEMP/check/AgentScreen-$VERSION.dmg" | cut -d' ' -f1)"
            sed -i "s/^  sha256 \".*\"/  sha256 \"$sha\"/" target/agent-screen.rb
          else
            knope release --verbose
            # knope titles a release by version and date; add the name and
            # how to install.
            notes="$(gh release view "v$VERSION" --json body --jq .body)"
            printf '%s\n\n%s\n' "$notes" "$(cat .github/release-footer.md)" > "$RUNNER_TEMP/notes.md"
            gh release edit "v$VERSION" --title "Agent Screen $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
            # The feed installed apps check, signed for this DMG.
            gh release upload "v$VERSION" target/appcast.xml --clobber
          fi
          # What users download must be what the cask names.
          rm -rf "$RUNNER_TEMP/check"
          gh release download "v$VERSION" --pattern '*.dmg' --dir "$RUNNER_TEMP/check"
          want="$(awk -F'"' '/sha256/ { print $2 }' target/agent-screen.rb)"
          got="$(sha256sum "$RUNNER_TEMP/check/AgentScreen-$VERSION.dmg" | cut -d' ' -f1)"
          [[ "$want" == "$got" ]] || { echo "::error::downloaded DMG is $got, cask says $want"; exit 1; }

      - name: Point the tap at it
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q git@github.com:Fanzzzd/homebrew-agent-screen.git "$RUNNER_TEMP/tap"
          cp target/agent-screen.rb "$RUNNER_TEMP/tap/Casks/agent-screen.rb"
          cd "$RUNNER_TEMP/tap"
          # The first release under this name adds the file.
          git add Casks/agent-screen.rb
          if git diff --cached --quiet; then
            echo "The tap already has agent-screen $VERSION"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qm "agent-screen $VERSION"
          git push -q origin HEAD:main
