# Publishes a release when a "Release Sidescreen x.y.z" pull request from
# prepare-release.yml merges: checks, signs and builds the DMG, has knope
# tag v<version> and publish the GitHub release with the CHANGELOG.md
# section and the DMG, then points the Homebrew tap at it.
#
# Run it from the Actions tab for a dry run: check, sign and build only,
# with the DMG kept as an artifact. With "publish" ticked it publishes the
# current version instead, skipping what's already done: to finish a
# release that failed partway.
#
# Secrets:
# - DEVELOPER_ID_P12_BASE64, DEVELOPER_ID_P12_PASSWORD: the Developer ID
#   Application certificate and its private key.
# - TAP_DEPLOY_KEY: private half of a write deploy key of
#   Fanzzzd/homebrew-sidescreen.
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the current version, skipping what is already done'
        type: boolean
        default: false

permissions:
  contents: write

concurrency: release

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged && github.head_ref == 'release')
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Version
        id: version
        run: echo "version=$(awk -F'"' '/^version/ { print $2; exit }' rust/sidescreen/Cargo.toml)" >> "$GITHUB_OUTPUT"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Check
        working-directory: rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Import the Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$P12_PASSWORD" -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          existing=()
          while IFS= read -r line; do existing+=("$(echo "$line" | xargs)"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          security find-identity -v -p codesigning "$keychain" | grep -F "Developer ID Application"

      - name: Build the DMG and cask
        run: rust/sidescreen/scripts/release.sh

      - name: Keep the dry run's DMG
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: dry-run
          path: |
            rust/target/Sidescreen-*.dmg
            rust/target/sidescreen.rb

      - uses: knope-dev/action@v2.1.2
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        with:
          version: 0.23.0

      - name: Publish the release
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION is already released"
          else
            knope release --verbose
          fi
          # What users download must be what the cask names.
          gh release download "v$VERSION" --pattern '*.dmg' --dir "$RUNNER_TEMP/check"
          want="$(awk -F'"' '/sha256/ { print $2 }' rust/target/sidescreen.rb)"
          got="$(shasum -a 256 "$RUNNER_TEMP/check/Sidescreen-$VERSION.dmg" | cut -d' ' -f1)"
          [[ "$want" == "$got" ]] || { echo "::error::downloaded DMG is $got, cask says $want"; exit 1; }

      - name: Point the tap at it
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q git@github.com:Fanzzzd/homebrew-sidescreen.git "$RUNNER_TEMP/tap"
          cp rust/target/sidescreen.rb "$RUNNER_TEMP/tap/Casks/sidescreen.rb"
          cd "$RUNNER_TEMP/tap"
          if git diff --quiet; then
            echo "The tap already has sidescreen $VERSION"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qam "sidescreen $VERSION"
          git push -q origin HEAD:main
          rm "$key"

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2> /dev/null || true
