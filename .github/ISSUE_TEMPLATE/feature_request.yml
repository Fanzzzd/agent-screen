name: Feature request
description: Ask for something Agent Screen doesn't do yet.
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you or your agent tried to do, and where Agent Screen got in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: The behavior you want, from the user's side or the agent's.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today
      description: Workarounds, or other tools you tried.
  - type: input
    id: agent
    attributes:
      label: MCP client and agent
      placeholder: Claude Code 2.1, Codex CLI 0.50
