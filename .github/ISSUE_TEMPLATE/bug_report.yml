name: Bug report
description: Agent Screen did something wrong or broke.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Reports are public. Remove secrets, account details and unrelated user content from logs, screenshots and recordings.
        Report vulnerabilities privately through [Security Advisories](https://github.com/Fanzzzd/agent-screen/security/advisories/new), as [SECURITY.md](https://github.com/Fanzzzd/agent-screen/blob/main/SECURITY.md) says.
        Follow [Reporting bugs](https://github.com/Fanzzzd/agent-screen/blob/main/docs/REPORTING_BUGS.md). You can report older builds without upgrading first.
  - type: textarea
    id: diagnostics
    attributes:
      label: App and MCP diagnostics, versions and builds
      description: |
        In the failing MCP session, call `get_diagnostics` with `{}` and paste the report.
        Also run `"/Applications/Agent Screen.app/Contents/MacOS/AgentScreen" diagnostics --json` if useful. This identifies that CLI and the responding app, not the failing session's MCP.
        If either command/tool is unavailable on an older build, write `unavailable`, paste `"/Applications/Agent Screen.app/Contents/MacOS/AgentScreen" --version`, and say which app/MCP versions or builds remain unknown. Keep the original failure; no upgrade is required.
      render: text
      placeholder: "MCP get_diagnostics report, CLI diagnostics report, or unavailable with --version output and unknown app/MCP identities."
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Apple menu > About This Mac.
      placeholder: "26.1"
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: MCP client and agent
      description: The client that ran the tools, its version, and the Agent Screen MCP registration used. Say whether this was before or after a client/MCP restart.
      placeholder: Claude Code 2.1, Codex CLI 0.50
    validations:
      required: true
  - type: dropdown
    id: aerospace
    attributes:
      label: Do you run AeroSpace?
      options:
        - "No"
        - "Yes"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you and the agent did, in order. Include the tool calls if you have them.
      placeholder: |
        1. Ask the agent to open Calculator on its display.
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happened instead. Paste the error the agent got, if any.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste only the relevant lines from `~/Library/Logs/Agent Screen/displays.log` or Console. Review and redact secrets, paths and user content first.
      render: text
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, a screen recording, or other window managers you run.
