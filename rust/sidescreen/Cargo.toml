[package]
name = "sidescreen"
version = "0.1.12"
edition = "2024"
license = "MIT"
publish = false
description = "The Sidescreen menu bar app: Agent Displays, the control socket, Peek and the Viewer."

[[bin]]
name = "Sidescreen"
path = "src/main.rs"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "c83abe7d0e060de08db386fbf86f7e95bfe6cb09", default-features = false, features = ["font-kit"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "c83abe7d0e060de08db386fbf86f7e95bfe6cb09" }
gpui_macos = { git = "https://github.com/zed-industries/zed", rev = "c83abe7d0e060de08db386fbf86f7e95bfe6cb09", features = ["runtime_shaders", "font-kit"] }
futures = "0.3"
sidescreen-model = { path = "../sidescreen-model" }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time"] }
log = "0.4"
regex = "1"
sidescreen-mcp = { path = "../sidescreen-mcp" }

[target.'cfg(target_os = "macos")'.dependencies]
core-video = { version = "0.5.2", features = ["metal"] }
core-foundation = "0.10"
screencapturekit = { version = "11", features = ["macos_15_0"] }
objc2 = "0.6"
block2 = "0.6"
raw-window-handle = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-application-services = "0.3"
objc2-image-io = "0.3"
libc = "0.2"
objc2-user-notifications = "0.3"
objc2-quartz-core = "0.3"

[build-dependencies]
cc = "1"
