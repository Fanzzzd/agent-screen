[package]
name = "agent-screen-colorsync"
version = "0.0.0"
edition = "2024"
description = "Reclaims ColorSync's display registry: the root helper Agent Screen runs with sudo (ADR 0009)"
license = "MIT"
publish = false

[[bin]]
name = "agent-screen-colorsync"
path = "src/main.rs"

[dependencies]
plist = "1"
serde_json = "1"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
