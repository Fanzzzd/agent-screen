[package]
name = "sidescreen-mcp"
version = "0.1.0"
edition = "2024"
publish = false
description = "Sidescreen's MCP server: tools for Agent Sessions, served over stdio, talking to the app's control socket."

[[bin]]
name = "sidescreen-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
