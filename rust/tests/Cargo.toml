[package]
name = "agent-screen-tests"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "Scripts that drive a running Sidescreen through its control socket and its MCP server."

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
md-5 = "0.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
