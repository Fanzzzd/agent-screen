<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Acme Cloud · Settings</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 -apple-system, system-ui, sans-serif; background: #f4f5f7; color: #1d1d1f; }
  header { background: #fff; border-bottom: 1px solid #e3e4e8; padding: 14px 32px; font-weight: 700; font-size: 18px; }
  header span { color: #0a84ff; }
  main { max-width: 760px; margin: 32px auto; background: #fff; border-radius: 14px; padding: 24px 32px; box-shadow: 0 6px 24px rgba(0,0,0,.06); }
  h1 { font-size: 22px; margin: 0 0 16px; }
  label { display: block; font-size: 13px; color: #555; margin: 12px 0 4px; }
  input, select, textarea { width: 100%; padding: 9px 12px; font: inherit; border: 1px solid #d0d2d8; border-radius: 8px; background: #fff; }
  input:focus, textarea:focus { outline: 2px solid #0a84ff; border-color: transparent; }
  button { padding: 10px 18px; font: inherit; font-weight: 600; color: #fff; background: #0a84ff; border: 0; border-radius: 8px; }
  .done { display: none; margin-top: 14px; padding: 10px 12px; border-radius: 8px; background: #e8f8ee; color: #1a7f37; font-weight: 600; }
  main { max-width: 520px; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; }
  .switch { width: 46px; height: 28px; border-radius: 14px; background: #d0d2d8; position: relative; border: 0; padding: 0; margin: 0; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: none; }
  .switch[aria-checked=true] { background: #34c759; }
  .switch[aria-checked=true]::after { left: 21px; }
</style>
</head>
<body>
<header>Acme <span>Cloud</span></header>
<main>
  <h1>Workspace settings</h1>
  <label for="name">Workspace name</label>
  <input id="name" aria-label="Workspace name" value="Acme" autocomplete="off">
  <div class="row"><span>Two-factor sign-in</span><button class="switch" role="switch" aria-checked="false" aria-label="Two-factor sign-in" onclick="flip(this)"></button></div>
  <div class="row"><span>Weekly usage email</span><button class="switch" role="switch" aria-checked="true" aria-label="Weekly usage email" onclick="flip(this)"></button></div>
  <div class="row"><span>Audit log</span><button class="switch" role="switch" aria-checked="false" aria-label="Audit log" onclick="flip(this)"></button></div>
  <p><button onclick="document.getElementById('done').style.display='block'">Save changes</button></p>
  <div class="done" id="done">✓ Settings saved.</div>
</main>
<script>
  function flip(b) { b.setAttribute('aria-checked', b.getAttribute('aria-checked') === 'true' ? 'false' : 'true'); }
</script>
</body>
</html>
