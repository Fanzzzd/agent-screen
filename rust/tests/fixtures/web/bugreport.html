<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Acme Cloud · Report a bug</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 -apple-system, system-ui, sans-serif; background: #f4f5f7; color: #1d1d1f; }
  header { background: #fff; border-bottom: 1px solid #e3e4e8; padding: 14px 32px; font-weight: 700; font-size: 18px; }
  header span { color: #0a84ff; }
  main { max-width: 760px; margin: 32px auto; background: #fff; border-radius: 14px; padding: 24px 32px; box-shadow: 0 6px 24px rgba(0,0,0,.06); }
  h1 { font-size: 22px; margin: 0 0 16px; }
  label { display: block; font-size: 13px; color: #555; margin: 12px 0 4px; }
  input, select, textarea { width: 100%; padding: 9px 12px; font: inherit; border: 1px solid #d0d2d8; border-radius: 8px; background: #fff; }
  input:focus, textarea:focus { outline: 2px solid #0a84ff; border-color: transparent; }
  button { padding: 10px 18px; font: inherit; font-weight: 600; color: #fff; background: #0a84ff; border: 0; border-radius: 8px; }
  .done { display: none; margin-top: 14px; padding: 10px 12px; border-radius: 8px; background: #e8f8ee; color: #1a7f37; font-weight: 600; }
  main { max-width: 520px; }
  textarea { height: 110px; resize: none; }
</style>
</head>
<body>
<header>Acme <span>Cloud</span></header>
<main>
  <h1>Report a bug</h1>
  <form onsubmit="event.preventDefault(); send();">
    <label for="title">Title</label>
    <input id="title" aria-label="Title" autocomplete="off">
    <label for="severity">Severity</label>
    <select id="severity" aria-label="Severity"><option>Low</option><option selected>Medium</option><option>High</option></select>
    <label for="steps">Steps to reproduce</label>
    <textarea id="steps" aria-label="Steps to reproduce"></textarea>
    <p><button type="submit">Submit report</button></p>
  </form>
  <div class="done" id="done">✓ Report filed as BUG-142.</div>
</main>
<script>
  function send() {
    if (!document.getElementById('title').value.trim()) return;
    document.getElementById('done').style.display = 'block';
  }
</script>
</body>
</html>
