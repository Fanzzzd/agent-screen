<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Acme Cloud · Sign up</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 -apple-system, system-ui, sans-serif; background: #f4f5f7; color: #1d1d1f; }
  header { background: #fff; border-bottom: 1px solid #e3e4e8; padding: 14px 32px; font-weight: 700; font-size: 18px; }
  header span { color: #0a84ff; }
  main { max-width: 440px; margin: 40px auto; background: #fff; border-radius: 14px; padding: 28px 32px; box-shadow: 0 6px 24px rgba(0,0,0,.06); }
  h1 { font-size: 24px; margin: 0 0 18px; }
  label { display: block; font-size: 13px; color: #555; margin: 12px 0 4px; }
  input, select { width: 100%; padding: 10px 12px; font: inherit; border: 1px solid #d0d2d8; border-radius: 8px; background: #fff; }
  input:focus { outline: 2px solid #0a84ff; border-color: transparent; }
  button { margin-top: 20px; width: 100%; padding: 12px; font: inherit; font-weight: 600; color: #fff; background: #0a84ff; border: 0; border-radius: 8px; }
  .done { display: none; margin-top: 16px; padding: 12px; border-radius: 8px; background: #e8f8ee; color: #1a7f37; font-weight: 600; }
  .error { color: #d70015; font-size: 13px; min-height: 20px; }
</style>
</head>
<body>
<header>Acme <span>Cloud</span></header>
<main>
  <h1>Create your account</h1>
  <form onsubmit="event.preventDefault(); send();">
    <label for="name">Name</label>
    <input id="name" aria-label="Name" autocomplete="off">
    <label for="email">Work email</label>
    <input id="email" aria-label="Work email" autocomplete="off">
    <div class="error" id="error"></div>
    <label for="plan">Plan</label>
    <select id="plan" aria-label="Plan"><option>Starter</option><option selected>Team</option><option>Enterprise</option></select>
    <button type="submit">Create account</button>
  </form>
  <div class="done" id="done">✓ Account created. Welcome to Acme Cloud.</div>
</main>
<script>
  function send() {
    const email = document.getElementById('email').value;
    const error = document.getElementById('error');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { error.textContent = 'Enter a valid email address.'; return; }
    error.textContent = '';
    document.getElementById('done').style.display = 'block';
  }
</script>
</body>
</html>
