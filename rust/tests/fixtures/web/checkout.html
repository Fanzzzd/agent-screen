<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Acme Cloud · Checkout</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 -apple-system, system-ui, sans-serif; background: #f4f5f7; color: #1d1d1f; }
  header { background: #fff; border-bottom: 1px solid #e3e4e8; padding: 14px 32px; font-weight: 700; font-size: 18px; }
  header span { color: #0a84ff; }
  main { display: flex; gap: 24px; max-width: 860px; margin: 32px auto; }
  section { flex: 1; background: #fff; border-radius: 14px; padding: 24px 28px; box-shadow: 0 6px 24px rgba(0,0,0,.06); }
  h1 { font-size: 22px; margin: 0 0 14px; }
  label { display: block; font-size: 13px; color: #555; margin: 12px 0 4px; }
  input { width: 100%; padding: 10px 12px; font: inherit; border: 1px solid #d0d2d8; border-radius: 8px; }
  input:focus { outline: 2px solid #0a84ff; border-color: transparent; }
  .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
  .total { font-weight: 700; border: 0; }
  .lock { margin-top: 12px; font-size: 13px; color: #888; }
  button { margin-top: 18px; width: 100%; padding: 12px; font: inherit; font-weight: 600; color: #fff; background: #0a84ff; border: 0; border-radius: 8px; }
  .coupon { display: flex; gap: 8px; margin-top: 4px; }
  .coupon button { margin: 0; width: auto; padding: 10px 16px; background: #1d1d1f; }
  .saved { color: #1a7f37; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>Acme <span>Cloud</span></header>
<main>
  <section>
    <h1>Checkout</h1>
    <label for="company">Company</label>
    <input id="company" aria-label="Company" autocomplete="off">
    <label for="email">Billing email</label>
    <input id="email" aria-label="Billing email" autocomplete="off">
    <label for="card">Card number</label>
    <input id="card" aria-label="Card number" autocomplete="off" placeholder="1234 1234 1234 1234">
    <button type="button" id="pay">Pay $96</button>
    <div class="lock">🔒 Payments are processed securely.</div>
  </section>
  <section style="flex:.8">
    <h1>Order</h1>
    <div class="row"><span>Team plan × 4 seats</span><span>$96</span></div>
    <div class="row saved" id="discount" hidden><span>Coupon LAUNCH20</span><span>−$19.20</span></div>
    <div class="row"><span>Tax</span><span>$0</span></div>
    <div class="row total"><span>Total per month</span><span id="total">$96</span></div>
    <label for="code">Coupon</label>
    <div class="coupon"><input id="code" aria-label="Coupon" autocomplete="off"><button type="button" id="apply">Apply</button></div>
  </section>
</main>
<script>
  document.getElementById("apply").addEventListener("click", () => {
    if (document.getElementById("code").value.trim().toUpperCase() !== "LAUNCH20") return;
    document.getElementById("discount").hidden = false;
    document.getElementById("total").textContent = "$76.80";
    document.getElementById("pay").textContent = "Pay $76.80";
  });
</script>
</body>
</html>
