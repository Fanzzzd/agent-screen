<!doctype html>
<html>
  <head>
    <!-- One of the two windows of HARNESS_PAIR (#110): the user's on the
         main screen, the agent's on the Agent Display. Every event a test
         asks about goes to the console as "pair SIDE EVENT ...", which
         main.js writes to HARNESS_KEY_LOG. -->
    <style>
      html, body { margin: 0; height: 100%; background: #ffffff; font: 16px -apple-system; }
      form { margin: 60px 20px 20px; }
      input { width: 300px; height: 32px; font-size: 16px; box-sizing: border-box; }
      button { margin: 20px; width: 160px; height: 40px; font-size: 16px; }
      #count { margin: 20px; }
      #login { margin: 20px; }
      #login input { width: 180px; }
      #login button { margin: 0 0 0 10px; width: 100px; height: 32px; }
      #more { margin: 20px; }
      #more select { width: 140px; height: 28px; font-size: 16px; }
      #more a { margin-left: 20px; }
      #more button { margin: 0 0 0 20px; width: 80px; height: 28px; }
    </style>
  </head>
  <body>
    <form id="form">
      <input id="field" autocomplete="off" />
    </form>
    <button id="press">press</button>
    <div id="count">0</div>
    <!-- Two fields and a submit button, for Tab and Return (#110). -->
    <form id="login">
      <input id="first" autocomplete="off" />
      <input id="second" autocomplete="off" />
      <button id="submit">submit</button>
      <span id="status"></span>
    </form>
    <!-- A select, whose press opens a native menu, and a link whose page
         cancels its click, so following it changes nothing (#110). -->
    <div id="more">
      <select id="pick"><option>Apple</option><option>Banana</option></select>
      <a id="dead" href="#gone">dead link</a>
      <!-- Makes the page large, about 5000 elements, to time a press's
           check on it. -->
      <button id="grow">grow</button>
    </div>
    <ul id="long"></ul>
    <script>
      const side = new URLSearchParams(location.search).get("side") || "agent";
      document.title = `pair ${side}`;
      const field = document.getElementById("field");
      field.setAttribute("aria-label", `${side} field`);
      const press = document.getElementById("press");
      press.setAttribute("aria-label", `${side} press`);
      const log = (...parts) => console.log(["pair", side, ...parts].join(" "));
      // JSON, so a space or an empty value reads back as typed.
      const value = () => JSON.stringify(field.value);
      field.addEventListener("keydown", (e) => log("keydown", JSON.stringify(e.key)));
      field.addEventListener("input", () => log("input", value()));
      field.addEventListener("focus", () => log("focus"));
      field.addEventListener("blur", () => log("blur"));
      document.getElementById("form").addEventListener("submit", (e) => {
        e.preventDefault();
        log("submit", value());
      });
      field.addEventListener("keyup", (e) => {
        if (e.key === "Escape") log("escape");
      });
      const login = document.getElementById("login");
      for (const id of ["first", "second", "submit"]) {
        const el = document.getElementById(id);
        el.setAttribute("aria-label", `${side} ${id}`);
        el.addEventListener("focus", () => log("focus", id));
        el.addEventListener("keydown", (e) => log("keydown", id, JSON.stringify(e.key)));
      }
      login.addEventListener("submit", (e) => {
        e.preventDefault();
        const values = ["first", "second"].map((id) => document.getElementById(id).value);
        log("login-submit", JSON.stringify(values));
        // A page shows what a submit did, so an agent can tell it ran.
        document.getElementById("status").textContent = "sent";
      });
      const pick = document.getElementById("pick");
      pick.setAttribute("aria-label", `${side} pick`);
      pick.addEventListener("change", () => log("change", JSON.stringify(pick.value)));
      pick.addEventListener("focus", () => log("focus", "pick"));
      const dead = document.getElementById("dead");
      dead.setAttribute("aria-label", `${side} dead`);
      dead.addEventListener("click", (e) => {
        e.preventDefault();
        log("dead-click");
      });
      const grow = document.getElementById("grow");
      grow.setAttribute("aria-label", `${side} grow`);
      grow.addEventListener("click", () => {
        const list = document.getElementById("long");
        for (let i = 0; i < 2500; i++) {
          const item = document.createElement("li");
          item.textContent = `row ${i}`;
          list.appendChild(item);
        }
        log("grown", list.children.length);
      });
      // Focus events wait for the page to have focus, which a window that
      // isn't key may not; the focused element shows here either way.
      let active = document.activeElement && document.activeElement.id;
      setInterval(() => {
        const now = document.activeElement && document.activeElement.id;
        if (now !== active) {
          active = now;
          log("active", now || "none");
        }
      }, 50);
      let clicks = 0;
      press.addEventListener("click", () => {
        clicks++;
        document.getElementById("count").textContent = String(clicks);
        log("click", clicks);
      });
      addEventListener("keydown", (e) => {
        if (e.target !== field) log("keydown-page", JSON.stringify(e.key));
      });
      addEventListener("focus", () => log("page-focus", document.hasFocus()));
      addEventListener("blur", () => log("page-blur", document.hasFocus()));
      log("loaded", document.hasFocus());
    </script>
  </body>
</html>
