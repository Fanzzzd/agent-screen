<!doctype html>
<html>
  <body style="margin: 0; background: #222; font: 13px system-ui">
    <input id="user" style="position: absolute; left: 20px; top: 40px; width: 320px; height: 24px; box-sizing: border-box" />
    <input id="password" type="password" style="position: absolute; left: 20px; top: 110px; width: 320px; height: 24px; box-sizing: border-box" />
    <script>
      const user = document.getElementById("user");
      const password = document.getElementById("password");
      // "login focus=user|password|none text=USER|PASSWORD", then how
      // many presses the page got and whether it has focus.
      let downs = 0;
      document.addEventListener("mousedown", () => { downs += 1; setTimeout(show); });
      window.addEventListener("focus", () => setTimeout(show));
      window.addEventListener("blur", () => setTimeout(show));
      const show = () => {
        const focus = document.activeElement === user ? "user" : document.activeElement === password ? "password" : "none";
        document.title = `login focus=${focus} text=${user.value}|${password.value} downs=${downs} page=${document.hasFocus()}`;
      };
      for (const event of ["focusin", "focusout", "input"]) document.addEventListener(event, () => setTimeout(show));
      user.focus();
      show();
    </script>
  </body>
</html>
