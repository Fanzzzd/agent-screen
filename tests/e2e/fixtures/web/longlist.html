<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>top=0</title>
<style>
  body { margin: 0; font: 14px -apple-system, sans-serif; }
  #list { position: absolute; inset: 0; overflow-y: auto; }
  #space { position: relative; }
  .row { position: absolute; left: 0; right: 0; height: 30px; line-height: 30px; padding-left: 12px; border-bottom: 1px solid #eee; }
</style>
</head>
<body>
<!-- A virtualized list of 10,000 rows, 30 px each: only the rows in view
     exist. The title says how far it scrolled, for a test to read (#104). -->
<div id="list"><div id="space"></div></div>
<script>
  const rows = 10000, height = 30;
  const list = document.getElementById('list');
  const space = document.getElementById('space');
  space.style.height = rows * height + 'px';
  function draw() {
    const first = Math.floor(list.scrollTop / height);
    const count = Math.ceil(list.clientHeight / height) + 1;
    space.replaceChildren();
    for (let i = first; i < Math.min(rows, first + count); i++) {
      const row = document.createElement('div');
      row.className = 'row';
      row.style.top = i * height + 'px';
      row.textContent = 'Row ' + (i + 1);
      space.appendChild(row);
    }
    document.title = 'top=' + Math.round(list.scrollTop) + ' max=' + (list.scrollHeight - list.clientHeight);
  }
  list.addEventListener('scroll', draw);
  draw();
</script>
</body>
</html>
