<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>selects</title>
</head>
<body>
<p><label for="city">City</label><br>
<select id="city" aria-label="City">
  <option>Apple</option><option>Newark</option><option>New York</option><option>1</option><option>10</option><option>11</option><option>東京</option>
</select></p>
<!-- A select in a frame from another site, out of the pipe's script's
     reach: set_value types into this one. -->
<iframe id="frame" width="360" height="80" src="data:text/html;charset=utf-8,%3Clabel for=town%3ETown%3C/label%3E %3Cselect id=town aria-label=Town%3E%3Coption%3EApple%3C/option%3E%3Coption%3ENewark%3C/option%3E%3Coption%3ENew York%3C/option%3E%3Coption%3EUnited States%3C/option%3E%3Coption%3EUruguay%3C/option%3E%3Coption%3E10%3C/option%3E%3Coption%3E11%3C/option%3E%3C/select%3E%3Cscript%3Econst t = document.getElementById('town'); let n = 0; const say = () => parent.postMessage({ town: t.value, changes: n }, '*'); t.addEventListener('change', () => { n++; say(); }); say();%3C/script%3E"></iframe>
<script>
  // The title says what the select shows and how many input and change
  // events it fired, so a script sees an item passed on the way.
  const city = document.getElementById('city');
  let inputs = 0, changes = 0, town = '', townChanges = 0;
  const state = () => {
    document.title = `city=${city.value} inputs=${inputs} changes=${changes} town=${town} tchanges=${townChanges} `;
  };
  window.addEventListener('message', (e) => { town = e.data.town; townChanges = e.data.changes; state(); });
  city.addEventListener('input', () => { inputs++; state(); });
  city.addEventListener('change', () => { changes++; state(); });
  state();
</script>
</body>
</html>
