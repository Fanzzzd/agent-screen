[package]
name = "agent-screen-linux-e2e"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "End-to-end tests driving `agent-screen mcp` and `apps/linux` against headless sway on Linux."

[dependencies]
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
