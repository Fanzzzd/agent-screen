[package]
name = "agent-screen-linux"
version = "0.1.37"
edition = "2024"
license = "MIT"
publish = false
description = "The Linux Agent Screen daemon: isolated Wayland Agent Displays, control socket, Web Preview, and `agent-screen mcp`."

[[bin]]
name = "agent-screen"
path = "src/main.rs"

[dependencies]
agent-screen-app-core = { path = "../../crates/app-core" }
agent-screen-mcp = { path = "../../crates/mcp" }
agent-screen-model = { path = "../../crates/model" }
anyhow = "1"
base64 = "0.22"
futures = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "signal"] }

[target.'cfg(target_os = "linux")'.dependencies]
agent-screen-ui-common = { path = "../../crates/ui-common" }
atspi = { version = "0.29", default-features = false, features = ["proxies", "connection", "tokio", "zbus"] }
gpui = { git = "https://github.com/zed-industries/zed", rev = "c83abe7d0e060de08db386fbf86f7e95bfe6cb09", default-features = false, features = ["font-kit", "wayland"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "c83abe7d0e060de08db386fbf86f7e95bfe6cb09", default-features = false, features = ["wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ksni = "0.3"
libc = "0.2"
smallvec = "1"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
x11rb = "0.14"
zbus = { version = "5", default-features = false, features = ["tokio"] }
