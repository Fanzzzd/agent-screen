[package]
name = "linux-compositor-spike"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Phase 0 real-desktop verification spike for isolated Wayland Agent Displays on Linux."

[dependencies]
anyhow = "1"
atspi = { version = "0.29", default-features = false, features = ["proxies", "connection", "tokio", "zbus"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
x11rb = "0.14"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[workspace]
