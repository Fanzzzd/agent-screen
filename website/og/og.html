<!doctype html>
<!-- Source of public/og.png. Render at 1200x630: see website/README.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/styles.css">
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; margin: 0; }
  .og { position: relative; width: 1200px; height: 630px; padding: 56px 64px; }
  .og .brand { font-size: 24px; gap: 12px; }
  .og h1 { font-size: 56px; line-height: 1.04; letter-spacing: -0.04em; font-weight: 700; margin-top: 72px; max-width: 450px; }
  .og p { font-size: 24px; line-height: 1.4; color: var(--secondary); margin-top: 22px; max-width: 470px; }
  .og img.shot { position: absolute; left: 560px; top: 120px; width: 760px; border-radius: 14px; box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 30px 80px -20px rgba(0,0,0,.35); }
</style>
</head>
<body>
<div class="og">
  <div class="brand"><img src="/logo.svg" alt="" width="36" height="35"><span>Agent Screen</span></div>
  <h1>Give each AI agent its own Mac screen.</h1>
  <p>Your cursor, keyboard and windows stay yours.</p>
  <img class="shot" src="/media/og-shot.jpg" alt="">
</div>
</body>
</html>
