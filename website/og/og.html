<!doctype html>
<!-- Source of public/og.png. Render at 1200x630: see website/README.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/styles.css">
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; margin: 0; background: #0a0a0c; }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; text-align: center; }
  .og .shot { position: absolute; left: 50%; top: 250px; width: 1300px; transform: translateX(-50%); border-radius: 18px; opacity: .9;
    -webkit-mask-image: linear-gradient(180deg, #000 40%, transparent 92%); mask-image: linear-gradient(180deg, #000 40%, transparent 92%); }
  .og .brand { position: absolute; left: 0; right: 0; top: 46px; justify-content: center; font-size: 24px; gap: 12px; color: #f5f5f7; }
  .og h1 { position: absolute; left: 0; right: 0; top: 104px; font-size: 64px; line-height: 1.02; letter-spacing: -0.045em; font-weight: 700; margin: 0;
    background: linear-gradient(180deg, #fff 30%, #a9a9b0 110%); -webkit-background-clip: text; background-clip: text; color: transparent; }
</style>
</head>
<body>
<div class="og">
  <img class="shot" src="/media/og-shot.jpg" alt="">
  <div class="brand"><img src="/logo-dark.svg" alt="" width="34" height="33"><span>Agent Screen</span></div>
  <h1>Give each AI agent its own Mac screen.</h1>
</div>
</body>
</html>
