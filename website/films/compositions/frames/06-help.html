        var ptr = q(".h06-ptr");

        var END = 6;

        // pointer hotspot is at (6,6) of the 60x90 image
        var HS = 6;
        var P_OFF = { x: 2050, y: 1180 }; // off-stage, bottom right
        var P_TAKE = { x: 966 - HS, y: 727 - HS }; // Take Over, a few px off centre
        var P_USER = { x: 1188 - HS, y: 592 - HS }; // Username field
        var P_CONT = { x: 1628 - HS, y: 229 - HS }; // Let Claude Code Continue

        // morph geometry. Card 900x620 centred (650,500); Viewer 1580x740 centred (1350,520).
        // The Viewer starts uniformly scaled to the card's height (S0) and cropped to its width,
        // centred on the card, so it is the card's box exactly. Both then grow with one ease.
        var S0 = 620 / 740;
        var INSET0 = ((1580 - 900 / S0) / 2).toFixed(1) + "px";
        var R0 = (40 / S0).toFixed(1) + "px";
        var CLIP0 = "inset(0px " + INSET0 + " 0px " + INSET0 + " round " + R0 + ")";
        var CLIP1 = "inset(0px 0px 0px 0px round 30px)";

        var PTR_SHADOW = "drop-shadow(0px 6px 10px rgba(0,0,0,0.5)) ";
        var ptrSharp = PTR_SHADOW + "blur(0px)";
        var ptrBlur = PTR_SHADOW + "blur(4px)";

        var tl = gsap.timeline({ paused: true });

        // camera: one continuous push and drift, start to cut, never at rest
        tl.fromTo(cam, { scale: 1, x: 0, y: 0 }, { scale: 1.06, x: -70, y: -14, duration: END, ease: "none" }, 0);
        // ground: handoff still pushing from t=0, drifting the other way at ~30%
        tl.fromTo(bg, { scale: 1, x: 0 }, { scale: 1.04, x: 21, duration: END, ease: "none" }, 0);

        // initial states
        tl.set(stGrey, { opacity: 0 }, 0);
        tl.set(vtake, { opacity: 0 }, 0);
        tl.set(ptr, { x: P_OFF.x, y: P_OFF.y, scale: 1 }, 0);

        // Help card drops at 0.45, motion blur on the fast part
        tl.fromTo(card, { y: -900 }, { y: 0, duration: 0.4, ease: "expo.out" }, 0.45);
        tl.fromTo(card, { filter: "blur(14px)" }, { filter: "blur(0px)", duration: 0.28, ease: "expo.out" }, 0.45);
        // title and buttons rise in behind it while it settles
        tl.fromTo(cardText, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out", stagger: 0.05 }, 0.53);

        // the agent types its ask 0.75-1.60, small irregular gaps, a little longer after spaces
        var B0 = 0.75,
          B1 = 1.6;
        var GAPS = [1.0, 0.8, 1.25, 0.9, 1.1, 0.75, 1.3, 0.95];
        var acc = [0];
        for (var i = 1; i < bodyChars.length; i++) {
          var w = GAPS[i % GAPS.length] * (bodyChars[i - 1].textContent === " " ? 1.3 : 1);
          acc.push(acc[i - 1] + w);
        }
        var span = acc[acc.length - 1];
        tl.set(bodyCaret, { display: "inline-block" }, B0 - 0.05);
        for (var j = 0; j < bodyChars.length; j++) {
          tl.set(bodyChars[j], { display: "inline" }, B0 + ((B1 - B0) * acc[j]) / span);
        }
        tl.set(bodyCaret, { display: "none" }, 1.72);

        // Take Over glows at 1.7

          takeover,
          { boxShadow: "0 0 0 0px rgba(255,159,10,0)" },

        tl.fromTo(ptr, { filter: ptrSharp }, { filter: ptrBlur, duration: 0.15, ease: "power1.in" }, 1.8);
        tl.to(ptr, { filter: ptrSharp, duration: 0.15, ease: "power1.out" }, 2.0);
        tl.to([takeover, ptr], { scale: 0.92, duration: 0.05, ease: "power1.in" }, 2.25);
        tl.to([takeover, ptr], { scale: 1, duration: 0.18, ease: "power2.out" }, 2.3);

        // card -> Viewer morph 2.35-2.9. The Viewer is drawn under the card from 2.35 and they
        // crossfade mid-morph, so the panel always shows the card's content or the Viewer's.
        var M0 = 2.35,
          MD = 0.55;
        tl.fromTo(viewer, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, M0);
        tl.fromTo(
          viewer,
          { x: -700, y: -20, scale: S0, clipPath: CLIP0 },
          { x: 0, y: 0, scale: 1, clipPath: CLIP1, duration: MD, ease: "expo.inOut" },
          M0
        );
        tl.to(card, { x: 700, y: 20, scale: 1 / S0, duration: MD, ease: "expo.inOut" }, M0);
        tl.to(card, { opacity: 0, duration: 0.22, ease: "power1.inOut" }, M0 + 0.13);
        // blur only through the fast middle of the morph
        tl.fromTo(viewer, { filter: "blur(0px)" }, { filter: "blur(5px)", duration: 0.11, ease: "power1.in" }, M0 + 0.15);
        tl.to(viewer, { filter: "blur(0px)", duration: 0.15, ease: "power1.out" }, M0 + 0.26);
        tl.to(card, { filter: "blur(5px)", duration: 0.11, ease: "power1.in" }, M0 + 0.15);
        // the ground blur deepens
        tl.fromTo(
          bg,
          { filter: "blur(6px) brightness(0.45)" },
          { filter: "blur(14px) brightness(0.32)", duration: MD, ease: "expo.inOut" },
          M0

        // sign-in form overlays: username and password fields, characters and carets
        var fUser = q(".h06-f-user");
        var fPass = q(".h06-f-pass");

        var passCaret = fPass.querySelector(".h06-caret");
