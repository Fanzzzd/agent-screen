# Releases: see docs/DEVELOPMENT.md. Each user-facing change adds a file to
# .changeset (`knope document-change`); every push to main refreshes a
# "chore(release): Agent Screen x.y.z" pull request, and merging it
# releases.

[package]
versioned_files = [
  "apps/macos/Cargo.toml",
  "crates/mcp/Cargo.toml",
  "crates/model/Cargo.toml",
  { path = "Cargo.lock", dependency = "agent-screen" },
  { path = "Cargo.lock", dependency = "agent-screen-mcp" },
  { path = "Cargo.lock", dependency = "agent-screen-model" },
]
changelog = "CHANGELOG.md"
assets = "target/AgentScreen-*.dmg"

# Commits follow Conventional Commits (see CONTRIBUTING.md), but knope
# reads none of them: versions and notes come from changesets only.
[changes]
ignore_conventional_commits = true

[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"

[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "Command"
command = "git switch -c release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = "git commit -m \"chore(release): Agent Screen $version\""

[[workflows.steps]]
type = "Command"
command = "git push --force --set-upstream origin release"

[[workflows.steps]]
type = "CreatePullRequest"
base = "main"

[workflows.steps.title]
template = "chore(release): Agent Screen $version"

[workflows.steps.body]
template = "Merging this releases Agent Screen $version: a signed DMG on GitHub and the Homebrew cask.\n\n$changelog"

[[workflows]]
name = "release"

[[workflows.steps]]
type = "Release"

[github]
owner = "Fanzzzd"
repo = "agent-screen"
